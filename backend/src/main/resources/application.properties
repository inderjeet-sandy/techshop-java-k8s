server.port=8080
spring.application.name=TechShop-Java-Backend

# ─── H2 In-Memory Database ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:techshopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ─── JPA ──────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ─── Flyway ───────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── Actuator ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ─── Micrometer OTLP (DigiCert Lesson) ────────────────────
# DO NOT use micrometer-registry-new-relic — deprecated Insights API
# NR engineers: "We will advise users against using it"
# This sends directly to NR's OTLP endpoint — no proprietary dep needed
management.otlp.metrics.export.url=https://otlp.nr-data.net:4318/v1/metrics
management.otlp.metrics.export.headers.api-key=${NEW_RELIC_LICENSE_KEY:missing-key}
management.otlp.metrics.export.step=60s

# ─── Logging ──────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.techshop=DEBUG
logging.config=classpath:logback-newrelic.xml

# ─── Chaos / Feature Flags ────────────────────────────────
techshop.feature.n-plus-one-enabled=false
techshop.feature.slow-checkout-enabled=false
techshop.feature.payment-errors-enabled=false
techshop.feature.cardinality-bomb-enabled=false
techshop.async.order-processing-delay=500
