server {
    listen 80;
    server_name _;

    # Static SPA files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy /api/* to Java backend (ClusterIP DNS inside K8s)
    location /api/ {
        proxy_pass http://techshop-java-backend-svc:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Pass W3C distributed tracing headers — required for
        # Browser → Java APM distributed trace linkage in New Relic
        proxy_set_header traceparent  $http_traceparent;
        proxy_set_header tracestate   $http_tracestate;
        proxy_set_header newrelic     $http_newrelic;

        proxy_read_timeout 60s;
    }

    # K8s liveness/readiness probe
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
